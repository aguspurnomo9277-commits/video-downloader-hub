name: Test QuickJS Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-quickjs-android.yml'

jobs:
  build-quickjs:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan Android SDK dan NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools;ndk;27.2.12479018;cmake;3.22.1'

      - name: Ambil source QuickJS-NG
        run: git clone --depth 1 https://github.com/quickjs-ng/quickjs.git quickjs-ng

      - name: Build QuickJS untuk Android ARM64
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S quickjs-ng -B quickjs-ng/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQJS_BUILD_LIBC=ON
          cmake --build quickjs-ng/build --target qjs_exe --parallel 2
          mkdir -p output
          cp quickjs-ng/build/qjs output/qjs
          file output/qjs
          readelf -h output/qjs | grep -E 'Class:|Type:|Machine:'

      - name: Simpan binary hasil build
        uses: actions/upload-artifact@v4
        with:
          name: QuickJS-Android-ARM64
          path: output/qjs
